name: Weekly Meeting Reports

on:
  schedule:
    - cron: '0 11 * * 1'        # Mondays 11:00 UTC = 7:00 AM Eastern (6:00 AM in winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build reports, send nothing)'
        type: boolean
        default: true
      send_instructors:
        description: 'Send instructor emails'
        type: boolean
        default: true
      send_cas:
        description: 'Send CA emails'
        type: boolean
        default: true

jobs:
  weekly-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run weekly reports
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Data source: repo variable MEETINGS_SOURCE = email | xlsx | sheet  (default: sheet)
          MEETINGS_SOURCE: ${{ vars.MEETINGS_SOURCE || 'sheet' }}
          EXCLUDE_STUDENTS: ${{ vars.EXCLUDE_STUDENTS || 'jonathan|smith,test jon|smith,test jonathan|smith' }}
          MEETINGS_XLSX_URL: ${{ secrets.MEETINGS_XLSX_URL }}   # only for MEETINGS_SOURCE=xlsx
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}          # fallback only; used when no XLSX URL
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}               # optional; defaults to EMAIL_USER
          SEMESTER_START: ${{ vars.SEMESTER_START || '2026-08-24' }}
          MEETING_FORM_URL: ${{ vars.MEETING_FORM_URL || 'https://forms.cloud.microsoft/r/5zNSiU70si?origin=QRCode' }}
          SEND_INSTRUCTORS: ${{ github.event_name == 'schedule' && 'true' || inputs.send_instructors }}
          SEND_CAS: ${{ github.event_name == 'schedule' && 'true' || inputs.send_cas }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python weekly_instructor_reports.py

      # No artifact upload on purpose: previews/CSVs contain student names and this repo may be public.
